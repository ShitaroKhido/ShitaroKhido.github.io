name: Notify on Dev Push

on:
  push:
    branches: [dev]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send webhook
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"🚀 DEV updated by ${{ github.actor }}: ${{ github.event.head_commit.message }}\"}" \
          ${{ secrets.YOUR_WEBHOOK_URL }}
