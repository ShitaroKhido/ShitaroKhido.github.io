name: Notify on Dev Merge
on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚀 PR #${{ github.event.pull_request.number }} merged into DEV by ${{ github.actor }}"}' \
          ${{ secrets.YOUR_WEBHOOK_URL }}