name: Notify on Dev Push

on:
  push:
    branches: [dev]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send webhook
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚀 New push to DEV branch\nRepository: ${{ github.repository }}\nAuthor: ${{ github.actor }}\nCommit: ${{ github.event.head_commit.message }}\nURL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          }' \
          ${{ secrets.YOUR_WEBHOOK_URL }}

          