name: Discord Notification on Dev Push

on:
  push:
    branches:
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_URL="https://github.com/${{ github.repository }}"
          COMMIT_URL="$REPO_URL/commit/${{ github.sha }}"
          COMPARE_URL="$REPO_URL/compare/${{ github.event.before }}...${{ github.sha }}"

          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"username\": \"GitHub Actions\",
            \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
            \"embeds\": [{
              \"title\": \"🚀 Dev Branch Updated\",
              \"description\": \"A new commit has been pushed to **dev** branch.\",
              \"color\": 3066993,
              \"fields\": [
                {
                  \"name\": \"📦 Repository\",
                  \"value\": \"[${{ github.repository }}]($REPO_URL)\",
                  \"inline\": true
                },
                {
                  \"name\": \"🌿 Branch\",
                  \"value\": \"dev\",
                  \"inline\": true
                },
                {
                  \"name\": \"👤 Author\",
                  \"value\": \"${{ github.actor }}\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔖 Commit\",
                  \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\",
                  \"inline\": true
                },
                {
                  \"name\": \"💬 Message\",
                  \"value\": \"${{ github.event.head_commit.message }}\",
                  \"inline\": false
                },
                {
                  \"name\": \"🔍 Changes\",
                  \"value\": \"[View Compare]($COMPARE_URL)\",
                  \"inline\": false
                }
              ],
              \"footer\": {
                \"text\": \"GitHub Dev Branch • Continuous Integration\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }"